# Render Blueprint. Point Render at this repo via "New +" -> "Blueprint".
#
# The repo root holds no app of its own, so every service sets rootDir
# explicitly rather than letting Render autodetect at the top level.

databases:
  - name: instant-mechanic-db
    databaseName: instant_mechanic
    user: instant_mechanic
    plan: free

services:
  - type: web
    name: instant-mechanic-api
    runtime: docker
    # Both paths resolve from the repo root, not from any rootDir, so
    # they are spelled out in full. dockerContext is backend/ so the
    # Dockerfile's own COPY paths stay relative to the app.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: instant-mechanic-db
          property: connectionString
      # Set to the web service's URL once it exists, e.g.
      # https://instant-mechanic-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: LIVE_SIMULATOR_INTERVAL
        value: "6"

  - type: web
    name: instant-mechanic-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* are inlined at build time, so changing either of
      # these requires a redeploy of this service, not just a restart.
      # Set to the API service's URL once it exists, e.g.
      # https://instant-mechanic-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Same host as above with a wss:// scheme, e.g.
      # wss://instant-mechanic-api.onrender.com/ws/live
      - key: NEXT_PUBLIC_WS_URL
        sync: false
